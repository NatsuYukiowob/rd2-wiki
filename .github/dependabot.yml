# 只管 GitHub Actions：把 workflow 裡 pin 住的 SHA 與後面的 tag 註解一起升級（repo 開了 sha_pinning_required）。
# ⚠️ wrangler 的版本在 ci.yml 的 `jobs.deploy.env.WRANGLER_VERSION`，不在 Dependabot 的範圍，要手動升。
# 只把 minor／patch 併成一個 PR；major 各自一個 PR——deploy 與 pr-comment.yml 在 PR 上驗不到，
# major 升級要各自看 release note，不能混在例行的小升級裡一起 merge。
# npm 相依不交給它：資料與建置對版本敏感（E2E 的 Playwright 容器 tag 要跟 package-lock 同版），升級一律手動。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
