# CI：資料驗證、單元測試、建置、效能預算、PR 差異摘要，外加獨立的 E2E job 與部署 job。
#
# 這支 workflow 在 `pull_request` 事件上，即使是「別人 fork 出去的 repo 送進來的 PR」也會跑
# （GitHub 對 fork PR 一律只給唯讀的 GITHUB_TOKEN）。因此 verify／e2e 只宣告 `contents: read`，
# 不做任何需要寫入權限的事（例如貼 PR 留言）——那件事交給另一支由 `workflow_run` 觸發、
# 在「目標 repo 情境」下執行、擁有寫入權限的 pr-comment.yml，見該檔開頭註解。
#
# verify／e2e 預設平行跑、彼此不 `needs`：資料驗證與單元測試通常幾秒到幾十秒就有結果，不應該被
# 「安裝瀏覽器＋起站台」拖慢到好幾分鐘後才回報——想快速看到「資料本身有沒有問題」的人不需要等
# E2E 裝完瀏覽器。deploy 則相反，必須等兩者都綠（`needs`），因為它的存在意義就是「CI 綠才上線」。
#
# ⚠️ job 的 `name` 一律用 ASCII：main 的 ruleset 把 `verify`／`e2e` 設成 required status checks，
# 而 required check 是用**名字**綁定的——改名會讓那條規則永遠停在 pending、PR 再也 merge 不了。
# 要改名就得同時改 ruleset（`gh api repos/NatsuYukiowob/rd2-wiki/rulesets`）。
#
# ⚠️ 所有 action 都 pin 到完整 commit SHA（後面註解保留原本的 tag）：repo 的 Actions 設定開了
# 「Require actions to be pinned to a full-length commit SHA」，寫成 `@v4` 會被 GitHub 直接拒跑。
# 升級時把 SHA 與註解一起換掉（`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`）。
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# 同一個 PR 連續推 commit 時取消舊的跑；main 上不取消，避免把跑到一半的部署砍掉。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # fetch-depth 0：下面「產生差異摘要」步驟要用 git worktree 簽出 PR 的 base commit
        # 來跑一次 base 版本的 build:data，沒有完整歷史會找不到那個 commit。
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', cache: npm }
      # --ignore-scripts：fork PR 改得動 package.json 的 lifecycle script，而 `npm ci` 會在
      # runner 上執行它。這個 repo 的相依套件不需要安裝腳本也能用（sharp 的原生二進位走
      # optionalDependencies 的預建檔），拿掉它就少一條「不必動任何原始碼就能在 CI 執行任意程式」的路。
      #
      # ⚠️ 這**不代表這個 job 是沙箱**：下面每一步（validate／build／typecheck／test）跑的都是
      # PR 端的 tools/、src/、tests/ 與 package.json 裡的 script 本體，fork PR 一律能在這裡執行程式碼。
      # 所以這個 job 永遠只給 `contents: read`，也永遠不要往它加 secret 或提權——真正的隔離靠的是
      # 權限最小化與 pr-comment.yml 那條信任邊界，不是這個旗標。
      - run: npm ci --ignore-scripts
      - name: 資料驗證（規則 0–10，見 CONTRIBUTING.md）
        run: npm run validate
      - name: 正規化定點檢查
        # 正本必須是 `npm run normalize` 的定點（跑過等於沒跑）。貢獻者忘了跑 normalize 時，
        # 這一步會紅並印出差異——不然含 Inkscape 圖層／matrix 的檔案會混進正本，之後每次
        # 有人跑 normalize 都會冒出一堆與自己無關的雜訊 diff。
        run: |
          npm run normalize
          git diff --exit-code data/dice-tree.svg
      - name: 建置資料與站台
        # npm run build = build:data + astro build；build:data 的 CLI 區塊本身就會檢查
        # tree.json gzip 與 sprite.webp 是否超過效能預算（規則 12），超過會讓這一步直接失敗、
        # 並印出目前用量與剩餘餘裕。下面「效能預算」步驟是對同一批產物再做一次獨立的檔案層級
        # 覆核，兩邊算出來的數字理論上會一致。
        #
        # 這一步刻意排在「單元測試」之前：多支測試檔（tests/lib/*.test.ts、
        # tests/scripts/tree-canvas.test.ts…）直接讀 src/generated/tree.json，這是
        # build:data 的產物、不進版控（.gitignore），在乾淨 clone 下若測試先跑會直接
        # ENOENT。package.json 的 `pretest` 已經會在 `npm test` 前自動跑一次
        # `build:data`，這裡的步驟順序是第二層保險（互為保險，其中一層失效另一層還在）。
        run: npm run build
      - name: 型別檢查
        run: npm run typecheck
      - name: 單元測試
        run: npm test
      - name: 效能預算（規則 12：對建置產物做獨立覆核，並印出用量／剩餘餘裕）
        run: |
          gz_budget=20480
          sprite_budget=409600
          gz=$(gzip -c src/generated/tree.json | wc -c)
          sprite=$(stat -c%s public/assets/sprite.webp)
          gz_margin=$((gz_budget - gz))
          sprite_margin=$((sprite_budget - sprite))
          echo "tree.json gzip = ${gz} bytes / 預算 ${gz_budget} bytes，餘裕 ${gz_margin} bytes"
          echo "sprite.webp   = ${sprite} bytes / 預算 ${sprite_budget} bytes，餘裕 ${sprite_margin} bytes"
          test "$gz" -le "$gz_budget" || { echo "::error::tree.json gzip 後 ${gz} bytes 超過效能預算 ${gz_budget} bytes"; exit 1; }
          test "$sprite" -le "$sprite_budget" || { echo "::error::sprite.webp ${sprite} bytes 超過效能預算 ${sprite_budget} bytes"; exit 1; }
      - name: 產生差異摘要（規則 11：id 變動警告）
        if: github.event_name == 'pull_request'
        run: |
          cp src/generated/tree.json /tmp/head.json
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          (cd /tmp/base && npm ci --ignore-scripts && npm run build:data && cp src/generated/tree.json /tmp/base.json)
          npx tsx tools/diff-summary.ts /tmp/base.json /tmp/head.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          # 上傳的是**資料**（JSON）不是版面（Markdown）。這一步跑的是 PR 端的程式碼，
          # fork 想寫什麼進去都可以；留言長什麼樣由 pr-comment.yml 用 default branch 的
          # 渲染器決定，見 tools/diff-summary.ts 的 renderDiffComment 說明。
          name: diff-summary
          path: diff-summary.json
      - name: 上傳建置產物（給 deploy 用）
        # 「CI 綠才上線」要成立，上線的就得是**被驗過的那份 dist**，不是另外再建一次的產物。
        # 重建會引入 sharp 編碼、astro 資產雜湊、兩次 npm ci 之間 registry 變動等不確定性。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      # E2E 驗證的是「建置後、真實瀏覽器裡」的行為（見 playwright.config.ts 開頭註解），
      # 所以要先把 Chromium 抓下來。
      #
      # ⚠️ **刻意不加 `--with-deps`，也不要加 actions/cache 快取 ~/.cache/ms-playwright。**
      # 2026-08-19 這一天在同一份 workflow、同一個指令上量到的四個點：
      #
      #   03:43Z  install --with-deps chromium   23 秒        run 32213164990
      #   07:31Z  install-deps chromium          3 分 13 秒    run 32228165427（cache hit 路徑）
      #   08:00Z  install-deps chromium          掛住 19 分撞 timeout   run 32230510120（main）
      #   08:22Z  install --with-deps chromium   掛住 6 分以上          run 32232296660
      #
      # 一開始我歸因成「install-deps 比 install --with-deps 慢」，那是錯的：把時間排開來看，
      # 兩個指令都在變慢，而它們的共通點是**都會跑 apt-get**。真正的變因是 GitHub runner 的
      # apt 來源，不是指令選擇，也不是快取。快取反而讓情況更糟——它只存得下瀏覽器本體，
      # 命中時仍得補跑 install-deps，等於把「唯一會慢的那件事」變成唯一還在做的事。
      #
      # 既然 apt 是我們控制不了的外部變因，作法是**完全不碰它**：只抓瀏覽器，不裝系統套件。
      # 前提是 GitHub 的 ubuntu-latest runner image 本來就內建 Chromium 需要的共用函式庫——
      # 這是**假設，不是已知**（本機環境跟 runner image 不同，驗不準）。若 Chromium 起不來，
      # 會在「端對端測試」那步立刻噴 launch 失敗，是幾秒內就看得到的紅燈，不是 20 分鐘的卡死。
      # 那時的下一手是改用官方容器（`container: mcr.microsoft.com/playwright:v1.62.1-noble`，
      # tag 要 pin 具體版本），image 內建瀏覽器與函式庫，整個問題類別消失。
      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install chromium
      - name: 端對端測試（含建置）
        # 這裡刻意沒有獨立的「建置站台」步驟：package.json 的 `pree2e` 已經會跑一次
        # `npm run build`，多加一步等於整包資料與站台建兩次（多花 5–7 秒且兩份產物可能不同步）。
        # 看到這裡覺得「怎麼沒建置」而想補回來的人，先看這行註解。
        run: npm run e2e
      - name: 上傳失敗痕跡
        # E2E 在 CI 上紅掉時，光看記錄檔很難知道是哪個斷言、畫面長怎樣。
        # ⚠️ 這裡**沒有** HTML 報告：playwright.config.ts 刻意用 `reporter: 'list'`（見該檔註解），
        # 所以 playwright-report/ 不會產生，只有 test-results/ 裡的截圖與 trace
        # （config 的 screenshot: only-on-failure、trace: retain-on-failure）。
        # 想要 HTML 報告就得先改 config 的 reporter，不是在這裡多列一個目錄。
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: deploy
    # 只有 main 上的 push 才部署；PR（含 fork PR）不部署，也拿不到下面的 secret。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 檢查部署憑證
        id: creds
        # secrets 不能用在 job 層的 `if`（GitHub 的 context 限制），所以在這裡判斷：
        # 憑證還沒設好時整個部署安靜跳過、CI 仍算綠，站台繼續由 Cloudflare 的 Git 整合更新。
        # 設好之後這裡自動轉成 true，才真正變成「CI 綠才上線」。
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID 未設定，跳過部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 取回 verify 驗過的建置產物
        # 刻意不在這裡重建：要上線的就是通過 validate／效能預算／單元測試／E2E 的那一份 dist。
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: 部署到 Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rd2-wiki --branch=main
