# CI：資料驗證、單元測試、建置、效能預算、PR 差異摘要，外加獨立的 E2E job 與部署 job。
#
# 這支 workflow 在 `pull_request` 事件上，即使是「別人 fork 出去的 repo 送進來的 PR」也會跑
# （GitHub 對 fork PR 一律只給唯讀的 GITHUB_TOKEN）。因此 verify／e2e 只宣告 `contents: read`，
# 不做任何需要寫入權限的事（例如貼 PR 留言）——那件事交給另一支由 `workflow_run` 觸發、
# 在「目標 repo 情境」下執行、擁有寫入權限的 pr-comment.yml，見該檔開頭註解。
#
# verify／e2e 預設平行跑、彼此不 `needs`：資料驗證與單元測試通常幾秒到幾十秒就有結果，不應該被
# 「安裝瀏覽器＋起站台」拖慢到好幾分鐘後才回報——想快速看到「資料本身有沒有問題」的人不需要等
# E2E 裝完瀏覽器。deploy 則相反，必須等兩者都綠（`needs`），因為它的存在意義就是「CI 綠才上線」。
#
# E2E 實際上跑在 `e2e-shard` 這個 matrix 上（分成 3 片、各自一台 runner），`e2e` 只是把三片的結果
# 收成一個檢查——為什麼要分片、為什麼不是多開 worker、為什麼停在 3 片，見該 job 上方的註解。
#
# ⚠️ job 的 `name` 一律用 ASCII：main 的 ruleset 把 `verify`／`e2e` 設成 required status checks，
# 而 required check 是用**名字**綁定的——改名會讓那條規則永遠停在 pending、PR 再也 merge 不了。
# 要改名就得同時改 ruleset（`gh api repos/NatsuYukiowob/rd2-wiki/rulesets`）。
#
# ⚠️ 所有 action 都 pin 到完整 commit SHA（後面註解保留原本的 tag）：repo 的 Actions 設定開了
# 「Require actions to be pinned to a full-length commit SHA」，寫成 `@v4` 會被 GitHub 直接拒跑。
# 升級時把 SHA 與註解一起換掉（`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`）。
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# 同一個 PR 連續推 commit 時取消舊的跑；main 上不取消，避免把跑到一半的部署砍掉。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # fetch-depth 0：下面「產生差異摘要」步驟要用 git worktree 簽出 PR 的 base commit
        # 來跑一次 base 版本的 build:data，沒有完整歷史會找不到那個 commit。
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', cache: npm }
      # --ignore-scripts：fork PR 改得動 package.json 的 lifecycle script，而 `npm ci` 會在
      # runner 上執行它。這個 repo 的相依套件不需要安裝腳本也能用（sharp 的原生二進位走
      # optionalDependencies 的預建檔），拿掉它就少一條「不必動任何原始碼就能在 CI 執行任意程式」的路。
      #
      # ⚠️ 這**不代表這個 job 是沙箱**：下面每一步（validate／build／typecheck／test）跑的都是
      # PR 端的 tools/、src/、tests/ 與 package.json 裡的 script 本體，fork PR 一律能在這裡執行程式碼。
      # 所以這個 job 永遠只給 `contents: read`，也永遠不要往它加 secret 或提權——真正的隔離靠的是
      # 權限最小化與 pr-comment.yml 那條信任邊界，不是這個旗標。
      - run: npm ci --ignore-scripts
      - name: 資料驗證（tools/validate.ts 的全部規則，說明見 CONTRIBUTING.md）
        run: npm run validate
      - name: 正規化定點檢查
        # 正本必須是 `npm run normalize` 的定點（跑過等於沒跑）。貢獻者忘了跑 normalize 時，
        # 這一步會紅並印出差異——不然含 Inkscape 圖層／matrix 的檔案會混進正本，之後每次
        # 有人跑 normalize 都會冒出一堆與自己無關的雜訊 diff。
        #
        # 它同時是「有人在 SVG 裡改文字」的守門員：normalize 會刪掉 g.node 底下的 <text>，
        # 內容與 data/nodes.json 的 label 不一致時逐筆列出並以非零 exit code 結束（見
        # tools/normalize-svg.ts 的 CLI 區塊）。正本正常情況下零個 <text>，不會誤報。
        run: |
          npm run normalize
          git diff --exit-code data/dice-tree.svg
      - name: 建置資料與站台
        # npm run build = build:data + astro build；build:data 的 CLI 區塊本身就會檢查
        # tree.json gzip 與 sprite.webp 是否超過效能預算（規則 12），超過會讓這一步直接失敗、
        # 並印出目前用量與剩餘餘裕。下面「效能預算」步驟是對同一批產物再做一次獨立的檔案層級
        # 覆核，兩邊算出來的數字理論上會一致。
        #
        # 這一步刻意排在「單元測試」之前：多支測試檔（tests/lib/*.test.ts、
        # tests/scripts/tree-canvas.test.ts…）直接讀 src/generated/tree.json，這是
        # build:data 的產物、不進版控（.gitignore），在乾淨 clone 下若測試先跑會直接
        # ENOENT。package.json 的 `pretest` 已經會在 `npm test` 前自動跑一次
        # `build:data`，這裡的步驟順序是第二層保險（互為保險，其中一層失效另一層還在）。
        run: npm run build
      - name: 型別檢查
        run: npm run typecheck
      - name: 單元測試
        run: npm test
      - name: 效能預算（規則 12：對建置產物做獨立覆核，並印出用量／剩餘餘裕）
        run: |
          gz_budget=20480
          sprite_budget=409600
          gz=$(gzip -c src/generated/tree.json | wc -c)
          sprite=$(stat -c%s public/assets/sprite.webp)
          gz_margin=$((gz_budget - gz))
          sprite_margin=$((sprite_budget - sprite))
          echo "tree.json gzip = ${gz} bytes / 預算 ${gz_budget} bytes，餘裕 ${gz_margin} bytes"
          echo "sprite.webp   = ${sprite} bytes / 預算 ${sprite_budget} bytes，餘裕 ${sprite_margin} bytes"
          test "$gz" -le "$gz_budget" || { echo "::error::tree.json gzip 後 ${gz} bytes 超過效能預算 ${gz_budget} bytes"; exit 1; }
          test "$sprite" -le "$sprite_budget" || { echo "::error::sprite.webp ${sprite} bytes 超過效能預算 ${sprite_budget} bytes"; exit 1; }
      - name: 產生差異摘要（規則 11：id 變動警告）
        if: github.event_name == 'pull_request'
        run: |
          cp src/generated/tree.json /tmp/head.json
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          (cd /tmp/base && npm ci --ignore-scripts && npm run build:data && cp src/generated/tree.json /tmp/base.json)
          npx tsx tools/diff-summary.ts /tmp/base.json /tmp/head.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          # 上傳的是**資料**（JSON）不是版面（Markdown）。這一步跑的是 PR 端的程式碼，
          # fork 想寫什麼進去都可以；留言長什麼樣由 pr-comment.yml 用 default branch 的
          # 渲染器決定，見 tools/diff-summary.ts 的 renderDiffComment 說明。
          name: diff-summary
          path: diff-summary.json
      - name: 上傳建置產物（給 deploy 用）
        # 「CI 綠才上線」要成立，上線的就得是**被驗過的那份 dist**，不是另外再建一次的產物。
        # 重建會引入 sharp 編碼、astro 資產雜湊、兩次 npm ci 之間 registry 變動等不確定性。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e-shard:
    name: e2e-shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # ⚠️ 2026-09-06 起 E2E 跑在 Playwright 官方容器裡，tag **pin 到 package-lock 的 @playwright/test 版本**
    #（兩邊版本不同時 Playwright 會拒絕啟動瀏覽器）。理由不只是下面那段 apt 的歷史：畫布改成 canvas 之後
    # 四張快照（tests/e2e/tree.spec.ts 的 F）比的是點陣圖，標籤字型差一點就整張紅——第一次在 ubuntu-latest
    # 裸 runner 上跑，241 顆節點的標籤全部不一樣（10,973 px）。容器把字型、Chromium 版本、字型渲染都釘死，
    # 本機用 `npm run e2e:snapshots`（同一個 image）產生與比對基準圖，CI 才會跟本機一致。
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    # E2E 是整個 CI 的關鍵路徑：2026-08-23 的 run 32655761955 逐步驟時間是
    # verify 47 秒、e2e 4 分 07 秒、deploy 30 秒——省時間只有省 e2e 這一條路。
    #
    # ⚠️ **不要改成「同一台 runner 開更多 worker」**。runner 是 4 vCPU，Playwright 預設砍半
    # （CI 日誌會印 `Running 334 tests using 2 workers`）。2026-08-25 在同為 4 核的機器上、
    # 同一份 dist、`CI=1` 實測三種設定：
    #
    #   2 workers（現況）                    216 秒 wall／380.7 test-seconds
    #   --workers=100%                       173 秒 wall／505.1 test-seconds
    #   --workers=100% --fully-parallel      152 秒 wall／562.6 test-seconds
    #
    # 牆鐘只換到 -30%，CPU 秒數卻多了 48%——瀏覽器測試本來就把 4 核吃滿，多開 worker 是拿
    # 爭用換平行度。代價還不只慢：`Z4`（tree.spec.ts 的 rAF 取樣）與 `Z6`（Esc 的監聽器順序）
    # 這種對排程抖動敏感的斷言在爭用下會紅，Z6 在 4 worker 那次連 retry 都沒救回來。
    #
    # 分片是乾淨的軸：每個 shard 是**自己的一台 runner**，worker 數維持 2、爭用不變，
    # 只是測試變少。同一天實測 `--shard=i/3` 為 60／83／89 秒，最長的那片決定牆鐘。
    #
    # 為什麼停在 3 片：每片都要重跑 set up job 5 秒＋checkout 1 秒＋setup-node 3 秒＋
    # `npm ci` 6 秒＋裝瀏覽器 11 秒＋`pree2e` 建置 8 秒 ≒ 43 秒固定成本。3 片時 89+43 ≒ 2 分 12 秒，
    # 4 片只再省十幾秒，固定成本已經佔掉一半。
    #
    # 分片數只寫在 `matrix.shard` 這一個地方，分母用 `strategy.job-total`（＝這個 matrix 展開出來的
    # job 數）帶進去。⚠️ 兩邊各寫一次的話，其中一個漂移方向是**安靜的**：只把分母改成 `/4`、
    # 忘了加 matrix 條目，1～3 片照樣全綠，而被分到第 4 片的那批測試從此完全沒跑過。
    # （反方向倒是會大聲紅：`--shard=4/3` 會被 Playwright 直接拒絕。）
    strategy:
      # fail-fast: false——一片紅掉時其餘的照跑完。預設的 true 會把其他 shard 直接砍掉，
      # 於是「只壞一個測試」跟「壞一整片」在 CI 上長得一模一樣，還少了另外兩片的失敗痕跡。
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      # E2E 驗證的是「建置後、真實瀏覽器裡」的行為（見 playwright.config.ts 開頭註解），
      # 所以要先把 Chromium 抓下來。
      #
      # ⚠️ **刻意不加 `--with-deps`，也不要加 actions/cache 快取 ~/.cache/ms-playwright。**
      # 2026-08-19 這一天在同一份 workflow、同一個指令上量到的四個點：
      #
      #   03:43Z  install --with-deps chromium   23 秒        run 32213164990
      #   07:31Z  install-deps chromium          3 分 13 秒    run 32228165427（cache hit 路徑）
      #   08:00Z  install-deps chromium          掛住 19 分撞 timeout   run 32230510120（main）
      #   08:22Z  install --with-deps chromium   掛住 6 分以上          run 32232296660
      #
      # 一開始我歸因成「install-deps 比 install --with-deps 慢」，那是錯的：把時間排開來看，
      # 兩個指令都在變慢，而它們的共通點是**都會跑 apt-get**。真正的變因是 GitHub runner 的
      # apt 來源，不是指令選擇，也不是快取。快取反而讓情況更糟——它只存得下瀏覽器本體，
      # 命中時仍得補跑 install-deps，等於把「唯一會慢的那件事」變成唯一還在做的事。
      #
      # 既然 apt 是我們控制不了的外部變因，作法是**完全不碰它**：只抓瀏覽器，不裝系統套件。
      # 前提是 GitHub 的 ubuntu-latest runner image 本來就內建 Chromium 需要的共用函式庫——
      # 這是**假設，不是已知**（本機環境跟 runner image 不同，驗不準）。若 Chromium 起不來，
      # 會在「端對端測試」那步立刻噴 launch 失敗，是幾秒內就看得到的紅燈，不是 20 分鐘的卡死。
      # 那時的下一手是改用官方容器（`container: mcr.microsoft.com/playwright:v1.62.1-noble`，
      # tag 要 pin 具體版本），image 內建瀏覽器與函式庫，整個問題類別消失。
      # 不再 `npx playwright install chromium`：容器 image 已內建對應版本的瀏覽器與系統函式庫。
      - name: 端對端測試（含建置）
        # 這裡刻意沒有獨立的「建置站台」步驟：package.json 的 `pree2e` 已經會跑一次
        # `npm run build`，多加一步等於整包資料與站台建兩次（多花 5–7 秒且兩份產物可能不同步）。
        # 看到這裡覺得「怎麼沒建置」而想補回來的人，先看這行註解。
        #
        # `--` 後面的旗標會原封不動傳給 `playwright test`，`pree2e` 照跑（實測 `--shard=2/3 --list`
        # 回 `Total: 114 tests in 4 files`）。分片是 Playwright 自己按檔案切的，各片不重疊也不遺漏。
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: 上傳失敗痕跡
        # E2E 在 CI 上紅掉時，光看記錄檔很難知道是哪個斷言、畫面長怎樣。
        # ⚠️ 這裡**沒有** HTML 報告：playwright.config.ts 刻意用 `reporter: 'list'`（見該檔註解），
        # 所以 playwright-report/ 不會產生，只有 test-results/ 裡的截圖與 trace
        # （config 的 screenshot: only-on-failure、trace: retain-on-failure）。
        # 想要 HTML 報告就得先改 config 的 reporter，不是在這裡多列一個目錄。
        #
        # ⚠️ 名字**必須帶 shard 編號**：upload-artifact@v4 不允許同一次 run 上傳兩個同名 artifact，
        # 兩片一起紅的時候第二片會 409 失敗，而那正是最需要看痕跡的情況。
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e:
    # 這個 job 不跑測試，只是把上面三片的結果收成一個叫 `e2e` 的檢查。
    #
    # ⚠️ **名字必須維持 `e2e`**：main 的 ruleset 把 `verify`／`e2e` 設成 required status checks，
    # 而 required check 是用**名字**綁的。matrix 產生的 job 叫 `e2e-shard 1`…，湊不出這個名字，
    # 所以真正被 ruleset 盯著的是這個彙總 job（要改名就得同時改 ruleset）。
    #
    # ⚠️ **條件式 ＋ 自己檢查 `result` 缺一不可。** 只寫 `needs:` 的話，某一片紅掉時這個 job
    # 會變成 skipped，而 **GitHub 把 skipped 的 required check 當成通過**——閘門會安靜地失效。
    #
    # ⚠️ 條件是 `!cancelled()` 而**不是 `always()`**：`always()` 連整個 run 被取消時都還會跑。
    # 這個 workflow 對 PR 開了 `cancel-in-progress`（見檔案上方 concurrency），連推兩個 commit 時
    # 舊的 run 會被取消、分片的 `result` 是 `cancelled`，用 `always()` 的話彙總 job 照跑照 exit 1，
    # 於是每次「推新 commit 蓋掉舊的」都多一顆紅色的 `e2e` 與一封失敗通知。真的有分片紅掉時
    # `result` 是 `failure` 不是 `cancelled`，`!cancelled()` 照樣會跑、照樣擋下來。
    # ⚠️ 要寫成 `${{ !cancelled() }}`：YAML 裡開頭的 `!` 是 tag 指示字，裸寫 `!cancelled()` 會解析失敗。
    name: e2e
    needs: [e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢查所有分片都綠
        run: |
          result='${{ needs.e2e-shard.result }}'
          echo "e2e-shard 的彙總結果：${result}"
          test "$result" = success

  deploy:
    name: deploy
    # 只有 main 上的 push 才部署；PR（含 fork PR）不部署，也拿不到下面的 secret。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 檢查部署憑證
        id: creds
        # secrets 不能用在 job 層的 `if`（GitHub 的 context 限制），所以在這裡判斷：
        # 憑證還沒設好時整個部署安靜跳過、CI 仍算綠，站台繼續由 Cloudflare 的 Git 整合更新。
        # 設好之後這裡自動轉成 true，才真正變成「CI 綠才上線」。
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID 未設定，跳過部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 取出 repo（Pages Functions 要從工作目錄打包）
        # ⚠️ **這一步必須排在 download-artifact 之前**：actions/checkout 預設 `clean: true`
        # 會清空工作目錄，順序反了會把下載好的 dist/ 洗掉，然後部署一個空目錄——
        # 而且 wrangler 大概不會報錯。
        #
        # 為什麼需要它：Cloudflare Pages 的 Functions 是看「執行指令的那個目錄底下有沒有
        # functions/」來決定要不要打包的（wrangler 內部是 path.join(process.cwd(), "functions")），
        # **不存在就整段跳過，沒有 warning、部署照樣回成功**。這個 job 原本刻意不做 checkout
        # （只拿 verify 驗過的 dist），代價就是 repo 根的 functions/ 永遠到不了 runner。
        #
        # 這裡只取原始碼、不跑 npm ci：Functions 由 wrangler 內建的 esbuild 打包，
        # 而 dist/ 仍然來自下一步的 artifact——**上線的靜態產物依舊是被驗過的那一份**。
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 取回 verify 驗過的建置產物
        # 刻意不在這裡重建：要上線的就是通過 validate／效能預算／單元測試／E2E 的那一份 dist。
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: 部署到 Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rd2-wiki --branch=main
